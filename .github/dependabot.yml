version: 2
# Autonomous Dependabot maintenance for clean-architecture-common.
# Security updates always raise PRs; version updates are grouped weekly.
# Auto-merge + branch delete: .github/workflows/dependabot-auto-merge.yml
#
# Private parent (m2-commons-parent) lives on GitHub Packages — Dependabot needs
# the registry below plus Dependabot secret GH_PACKAGES_TOKEN (read:packages).
registries:
  github-maven:
    type: maven-repository
    url: https://maven.pkg.github.com/sajeth/*
    username: sajeth
    password: ${{secrets.GH_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    registries:
      - github-maven
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "fix"
    labels:
      - "dependencies"
    groups:
      # All CalVer bumps of the private parent (incl. "major" year/month digits).
      m2-commons-parent:
        applies-to: version-updates
        patterns:
          - "io.github.sajeth:m2-commons-parent"
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
      maven-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "io.github.sajeth:m2-commons-parent"
