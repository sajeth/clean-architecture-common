name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [master]

permissions: {}

jobs:
  auto-merge:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge (Dependabot only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != 'dependabot[bot]' ] && [ "$ACTOR" != 'app/dependabot' ]; then
            echo "Skipping auto-merge for actor=$ACTOR (Dependabot only)."
            exit 0
          fi
          # GITHUB_TOKEN cannot approve PRs; only enable auto-merge.
          gh pr merge --auto --squash "$PR_URL" \
            && echo "Auto-merge enabled." \
            || echo "Auto-merge not available (repo setting disabled or already set); merge manually when checks pass."

  rebase-on-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    permissions:
      pull-requests: write
    steps:
      - name: Rebase open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,author \
            --jq '.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot") | .number' | \
          while read -r pr; do
            gh pr comment "$pr" --body "@dependabot rebase"
          done
