name: Publish to GitHub Packages

on:
  schedule:
    - cron: '0 6 1,15 * *'  # 1st and 15th of every month at 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 2026.5.1) — leave blank to auto-generate'
        required: false
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            echo "value=$VERSION_OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            # CalVer: YYYY.M.1 on the 1st, YYYY.M.2 on the 15th
            YEAR=$(date +'%Y')
            MONTH=$(date +'%-m')
            DAY=$(date +'%-d')
            RELEASE=$([[ "$DAY" -lt 15 ]] && echo 1 || echo 2)
            echo "value=${YEAR}.${MONTH}.${RELEASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.JAVA_VERSION || '25' }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Sync parent to latest m2-commons-parent
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          METADATA_URL="https://maven.pkg.github.com/sajeth/m2-java-parent/io/github/sajeth/m2-commons-parent/maven-metadata.xml"
          METADATA=$(curl -sf -u "${GITHUB_ACTOR}:${GH_PACKAGES_TOKEN}" "$METADATA_URL" || echo "")

          if [ -z "$METADATA" ]; then
            echo "::warning::Could not fetch $METADATA_URL — continuing with current parent version."
            exit 0
          fi

          LATEST_PARENT=$(echo "$METADATA" | grep -oP '(?<=<release>)[^<]+' | head -1)
          if [ -z "$LATEST_PARENT" ]; then
            LATEST_PARENT=$(echo "$METADATA" | grep -oP '(?<=<latest>)[^<]+' | head -1)
          fi

          if [ -z "$LATEST_PARENT" ]; then
            echo "::warning::Fetched maven-metadata.xml but could not parse a version — continuing with current parent."
            exit 0
          fi

          python3 - "$LATEST_PARENT" <<'EOF'
          import re, sys
          latest = sys.argv[1]
          content = open('pom.xml').read()
          current = re.search(r'<parent>[\s\S]*?<version>([^<]+)</version>', content)
          current = current.group(1) if current else ''
          if current == latest:
              print(f"m2-commons-parent already at {latest}")
          else:
              updated = re.sub(
                  r'(<parent>[\s\S]*?<version>)([^<]+)(</version>[\s\S]*?</parent>)',
                  lambda m: m.group(1) + latest + m.group(3),
                  content,
              )
              open('pom.xml', 'w').write(updated)
              print(f"m2-commons-parent updated: {current} → {latest}")
          EOF

      - name: Set version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mvn --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false

      - name: Build and publish to GitHub Packages
        run: mvn --no-transfer-progress deploy -DskipTests --batch-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Generate CycloneDX SBOM
        run: |
          mvn --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -DskipTests --batch-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create GitHub Release with SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists — skipping create."
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            --target "${RELEASE_SHA}" \
            target.nosync/bom.json \
            target.nosync/bom.xml

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            target.nosync/bom.json
            target.nosync/bom.xml

      - name: Commit version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No pom.xml changes to commit."
            exit 0
          fi
          git commit -m "ci: release v${RELEASE_VERSION} [skip ci]"
          git push
