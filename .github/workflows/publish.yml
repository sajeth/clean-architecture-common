name: Publish

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v5
        with:
          java-version: ${{ vars.JAVA_VERSION || '25' }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve latest parent version
        id: parent
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          METADATA_URL="https://maven.pkg.github.com/sajeth/m2-java-parent/io/github/sajeth/m2-commons-parent/maven-metadata.xml"
          METADATA=$(curl -sf -u "${GITHUB_ACTOR}:${GH_PACKAGES_TOKEN}" "$METADATA_URL" || echo "")

          if [ -z "$METADATA" ]; then
            echo "::error::Could not fetch $METADATA_URL — Ensure m2-commons-parent is published from m2-java-parent and GH_PACKAGES_TOKEN secret has read:packages scope."
            exit 1
          fi

          LATEST_PARENT=$(echo "$METADATA" | grep -oP '(?<=<release>)[^<]+' | head -1)
          if [ -z "$LATEST_PARENT" ]; then
            LATEST_PARENT=$(echo "$METADATA" | grep -oP '(?<=<latest>)[^<]+' | head -1)
          fi

          if [ -z "$LATEST_PARENT" ]; then
            echo "::error::Fetched maven-metadata.xml but could not parse a version from it."
            exit 1
          fi

          CURRENT_PARENT=$(python3 -c "
          import re
          text = open('pom.xml').read()
          match = re.search(r'<parent>[\s\S]*?<version>([^<]+)</version>', text)
          print(match.group(1) if match else '')
          ")

          echo "Resolved latest m2-commons-parent: $LATEST_PARENT (pom has $CURRENT_PARENT)"
          echo "LATEST_PARENT=$LATEST_PARENT" >> "$GITHUB_ENV"
          echo "latest=$LATEST_PARENT" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_PARENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_PARENT" = "$LATEST_PARENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update parent version and bump project version
        if: steps.parent.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.parent.outputs.changed }}" = "true" ]; then
            python3 .github/scripts/update_pom.py "$LATEST_PARENT"
          else
            python3 .github/scripts/update_pom.py
          fi

      - name: Commit version bump
        if: env.NEW_VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "No pom.xml changes to commit."
            exit 0
          fi
          BRANCH="chore/bump-version-to-${NEW_VERSION}"
          git checkout -B "$BRANCH"
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push origin --delete "$BRANCH" || true
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${NEW_VERSION} [skip ci]" \
            --body "Automated version bump: parent \`${LATEST_PARENT}\`, project \`${NEW_VERSION}\`." \
            --base master \
            --head "$BRANCH" || true
          gh pr merge "$BRANCH" --auto --squash || true

      - name: Deploy to GitHub Packages
        if: env.NEW_VERSION != '' || github.event_name == 'workflow_dispatch'
        run: mvn --no-transfer-progress deploy -DskipTests --batch-mode -Djava.version=${{ vars.JAVA_VERSION || '25' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Generate CycloneDX SBOM
        if: env.NEW_VERSION != '' || github.event_name == 'workflow_dispatch'
        run: |
          mvn --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -DskipTests --batch-mode -Djava.version=${{ vars.JAVA_VERSION || '25' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create GitHub Release with SBOM
        if: env.NEW_VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.NEW_VERSION }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists — skipping."
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            --target "${RELEASE_SHA}" \
            target.nosync/bom.json \
            target.nosync/bom.xml

      - name: Generate SLSA provenance attestation
        if: env.NEW_VERSION != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            target.nosync/bom.json
            target.nosync/bom.xml
