name: Release Drafter

on:
  push:
    branches: [master]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0  # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
