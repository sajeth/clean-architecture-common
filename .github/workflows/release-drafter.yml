name: Release Drafter

on:
  push:
    branches: [master]

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0  # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
