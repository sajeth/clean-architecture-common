name: OpenSSF Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'  # every Monday 03:00 UTC

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write   # required to publish results to OpenSSF API
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        id: scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # publish_results requires OIDC to api.securityscorecards.dev; disabled because
          # that external call was causing the job to fail when the API was unreachable.
          # SARIF is still uploaded to GitHub Security below.
          publish_results: false
        continue-on-error: true  # don't fail the job if scorecard itself errors

      - name: Upload Scorecard results to GitHub Security
        if: always()  # upload even if scorecard step errored, as long as SARIF exists
        uses: github/codeql-action/upload-sarif@3db7caf9014b962f9392088c0fcaf53eeddf47db  # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
