name: Sync m2-commons-parent

# Keep <parent> on Maven LATEST (do not pin CalVer).

on:
  schedule:
    - cron: '0 7 * * *'  # daily 07:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [m2-commons-parent-published]

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Ensure parent is LATEST
        id: sync
        run: |
          before=$(python3 -c 'import re; print(re.search(r"<parent>[\s\S]*?<version>([^<]+)</version>", open("pom.xml").read()).group(1))')
          bash ./sync-parent.sh --apply
          after=$(python3 -c 'import re; print(re.search(r"<parent>[\s\S]*?<version>([^<]+)</version>", open("pom.xml").read()).group(1))')
          if [ "$before" = "$after" ]; then
            {
              echo "changed=false"
              echo "version=$after"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "version=$after"
              echo "from=$before"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ steps.sync.outputs.from }}
          TO: ${{ steps.sync.outputs.version }}
        run: |
          BRANCH="chore/sync-m2-commons-parent-${TO}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pom.xml
          git commit -m "fix(deps): set m2-commons-parent to ${TO}"
          git push -u origin "$BRANCH"
          printf '%s\n' \
            "## Sync m2-commons-parent" \
            "" \
            "Set \`io.github.sajeth:m2-commons-parent\` \`${FROM}\` → \`${TO}\`." \
            "" \
            "Parent version is kept as Maven \`LATEST\` (not a CalVer pin)." \
            "" \
            "This PR will auto-merge once required checks pass." \
            > /tmp/pr-body.md
          gh pr create \
            --title "fix(deps): set m2-commons-parent to ${TO}" \
            --label "dependencies" \
            --body-file /tmp/pr-body.md \
            --base master \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch
